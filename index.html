<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Protótipo · acesso restrito</title>
<style>
  :root { --text: #f5f5f7; --muted: #8e8e93; --line: rgba(255,255,255,.14); --err: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100dvh; display: grid; place-items: center; overflow: hidden;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
  .glow { position: fixed; inset: -20%; z-index: 0; pointer-events: none; filter: blur(70px); opacity: .55;
    background: radial-gradient(40% 35% at 30% 30%, #2b3a55, transparent 70%), radial-gradient(35% 30% at 70% 70%, #3a2a2a, transparent 70%); }
  form { position: relative; z-index: 1; width: min(100%, 360px); padding: 28px 22px 22px; border-radius: 26px;
    background: rgba(255,255,255,.07); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(30px) saturate(160%); backdrop-filter: blur(30px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 30px 80px rgba(0,0,0,.5); }
  .lock { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 18px;
    background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.3); }
  h1 { font-size: 20px; font-weight: 650; letter-spacing: -.2px; margin: 0 0 6px; }
  p { margin: 0 0 22px; color: var(--muted); font-size: 14px; line-height: 1.45; }
  label.f { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .field { position: relative; }
  input[type=password], input[type=text] { width: 100%; height: 52px; border-radius: 14px; padding: 0 48px 0 16px;
    font-size: 16px; /* 16px evita o zoom automático do iOS */ color: var(--text); background: rgba(0,0,0,.35);
    border: 1px solid var(--line); outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: rgba(255,255,255,.45); box-shadow: 0 0 0 4px rgba(255,255,255,.08); }
  .eye { position: absolute; right: 6px; top: 6px; width: 40px; height: 40px; border: 0; background: none; color: var(--muted);
    border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
  .remember { display: flex; align-items: center; gap: 10px; margin: 16px 0 20px; font-size: 14px; color: var(--text); cursor: pointer; user-select: none; }
  .remember input { width: 20px; height: 20px; accent-color: #fff; margin: 0; }
  button.go { width: 100%; height: 52px; border: 0; border-radius: 14px; background: #fff; color: #000; font-size: 16px; font-weight: 600; cursor: pointer; }
  button.go:disabled { opacity: .6; cursor: default; }
  .err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 10px; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  noscript { position: relative; z-index: 1; }
</style>
</head>

  <h1>Protótipo em validação</h1>

    <button type="button" class="eye" id="eye" aria-label="Mostrar senha">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <label class="remember"><input type="checkbox" id="rem" checked> Lembrar neste aparelho</label>
  <button class="go" id="go" type="submit">Entrar</button>

</form>

<script>
(() => {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const KEY = "poc-bg-login-pass";
  const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const $ = id => document.getElementById(id);

  async function unlock(pass) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: ub64(P.salt), iterations: P.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(P.iv) }, key, ub64(P.data)); // lança erro se a senha estiver errada
    // a mesma chave abre as imagens em data/ — fica só nesta aba (sessionStorage)
    const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
    sessionStorage.setItem("poc-key-raw", btoa(String.fromCharCode(...raw)));
    return new TextDecoder().decode(plain);
  }
  function render(html) { document.open(); document.write(html); document.close(); }

  // senha lembrada
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) unlock(saved).then(render).catch(() => { try { localStorage.removeItem(KEY); } catch (e) {} });

  $("eye").onclick = () => { const i = $("pw"); i.type = i.type === "password" ? "text" : "password"; i.focus(); };
  $("f").onsubmit = async e => {
    e.preventDefault();
    const pass = $("pw").value; if (!pass) return;
    $("go").disabled = true; $("go").textContent = "Verificando…"; $("err").textContent = "";
    try {
      const html = await unlock(pass);
      try { $("rem").checked ? localStorage.setItem(KEY, pass) : localStorage.removeItem(KEY); } catch (e) {}
      render(html);
    } catch (err) {
      $("go").disabled = false; $("go").textContent = "Entrar";
      $("err").textContent = window.isSecureContext ? "Senha incorreta. Tente novamente." : "Abra pelo link https:// (o navegador bloqueia a criptografia fora dele).";
      $("f").classList.remove("shake"); void $("f").offsetWidth; $("f").classList.add("shake");
      $("pw").select();
    }
  };
})();
</script>
